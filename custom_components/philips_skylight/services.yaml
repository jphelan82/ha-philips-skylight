set_assumed_power:
  name: Set assumed power
  description: Tell Home Assistant the physical light's current power state without sending a command. Required after restart or a proxy outage before using turn_off, or turn_on without an effect.
  target:
    entity:
      integration: philips_skylight
      domain: light
  fields:
    is_on:
      name: Currently on
      description: Whether the physical Skylight is currently illuminated.
      required: true
      selector:
        boolean:
skip_sequence:
  name: Skip sequence forward (recovery)
  description: Jump the transmitter's mesh sequence counter forward by about one million. Use only when the panel ignores this transmitter after Home Assistant was rebuilt without a backup or restored from an older backup. Each skip uses one sixteenth of the counter's total range. Sends no light command.
  target:
    entity:
      integration: philips_skylight
      domain: light
  fields:
    confirm:
      name: Confirm recovery
      description: Confirm that the panel ignores this transmitter after a rebuild or restore.
      required: true
      selector:
        boolean:
pair_transmitter:
  name: Pair transmitter (experimental)
  description: Send the captured pairing request for 10 seconds after cycling the panel's mains power. May replace the existing remote's pairing. Completion does not confirm success; check the panel and original remote afterward.
  target:
    entity:
      integration: philips_skylight
      domain: light
  fields:
    confirm:
      name: Accept pairing change
      description: Confirm that you are ready to test pairing, which may require pairing the original remote again.
      required: true
      selector:
        boolean:
unpair_all_remotes:
  name: Unpair all remotes
  description: Makes the panel forget every paired sender, the original remote and this transmitter included. Use it only right after cycling the panel's mains power. Afterward, pair every remote again, and pair this transmitter again with Pair transmitter.
  target:
    entity:
      integration: philips_skylight
      domain: light
  fields:
    confirm:
      name: Accept removing every remote
      description: Confirm that you just cycled the panel's mains power and will pair every remote again.
      required: true
      selector:
        boolean:
