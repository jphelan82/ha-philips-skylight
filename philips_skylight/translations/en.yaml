configuration:
  auto_install_integration:
    name: Install the companion integration
    description: Install or update the bundled native light integration when this add-on starts. Existing entity IDs and sequence storage are preserved. A Home Assistant restart may be needed; it is never started automatically.
  auto_update_firmware_files:
    name: Update the firmware files
    description: When this add-on starts, copy new Skylight firmware files into the ESPHome folder for each proxy that uses the Skylight package. Old files are kept as backups, and the proxy's own YAML file does not change. You still install the firmware on the proxy in ESPHome Device Builder.
  log_level:
    name: Log level
    description: Amount of detail shown in the add-on log. Credentials are never logged.
