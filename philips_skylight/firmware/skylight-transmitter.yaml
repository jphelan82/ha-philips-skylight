# Local package: add `skylight: !include skylight-transmitter.yaml` under
# packages in your EXISTING node YAML. Copy components beside that YAML.
# Preserve Wi-Fi, OTA, API encryption, node name, and board settings.
esphome:
  min_version: 2026.4.5

# Raise this number with every change to this package or to
# components/ble_adv_proxy. tools/sync_addon.py refuses a change without it.
# The proxy reports the number, and the add-on compares it with its own copy to
# tell when the proxy needs an install.
substitutions:
  skylight_firmware: "1"

text_sensor:
  - platform: template
    name: Skylight firmware
    id: skylight_firmware_version
    icon: mdi:chip
    entity_category: diagnostic
    lambda: return {"${skylight_firmware}"};

api:
  custom_services: true
  homeassistant_services: true

# A wall-mounted proxy does not need to hunt for a stronger access point. With
# roaming on, ESPHome scans every five minutes and may switch access points.
# Each switch silently breaks the Home Assistant connection for up to about
# 45 seconds, and commands sent in that time are lost. ESPHome still reconnects
# if the access point goes away.
wifi:
  post_connect_roaming: false

ble_adv_proxy:
  use_max_tx_power: true

external_components:
  - source:
      type: local
      path: components
    components: [ble_adv_proxy]

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
