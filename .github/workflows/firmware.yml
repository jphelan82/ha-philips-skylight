name: Firmware
on:
  push:
    paths: ['esphome/**', '.github/esphome/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['esphome/**', '.github/esphome/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release that the package supports, and the newest one tested.
        esphome: ['2026.4.5', '2026.11.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-esphome-${{ matrix.esphome }}
      - run: python -m pip install esphome==${{ matrix.esphome }}
      # Build the package the way users do: the node YAML sits beside the package.
      - run: |
          mkdir build
          cp -R esphome/. build/
          cp .github/esphome/ci-node.yaml build/
          esphome compile build/ci-node.yaml
