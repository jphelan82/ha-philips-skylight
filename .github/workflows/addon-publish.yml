name: Publish add-on images
# Pushing a tag such as v0.2.5 builds and publishes prebuilt images to the
# GitHub container registry. Supervisor uses them only after config.yaml gets
#   image: "ghcr.io/jphelan82/{arch}-philips-skylight"
# and the package is readable by the people who install the add-on.
# This job can write packages, so its actions are pinned to exact commits.
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: amd64
          - arch: aarch64
            platform: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        run: |
          version="$(sed -n 's/^version: "\(.*\)"$/\1/p' philips_skylight/config.yaml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match config.yaml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./philips_skylight
          platforms: linux/${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/jphelan82/${{ matrix.arch }}-philips-skylight:${{ steps.version.outputs.version }}
            ghcr.io/jphelan82/${{ matrix.arch }}-philips-skylight:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
