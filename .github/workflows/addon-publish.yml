name: Publish add-on images
# Pushing a tag such as v0.2.5 builds and publishes prebuilt images to the
# GitHub container registry. config.yaml names them with
#   image: "ghcr.io/jphelan82/{arch}-philips-skylight"
# so Supervisor pulls these images instead of building the add-on. The package
# must be readable by the people who install the add-on.
# This workflow can write packages, so its actions are pinned to exact commits.
on:
  push:
    tags: ['v*']
jobs:
  test:
    # The same checks as tests.yml. No image is published if one fails.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: python -m pip install homeassistant==2026.6.0 pytest pytest-asyncio pytest-aiohttp ruff
      - run: python tools/sync_addon.py --check
      - run: python -m pytest -q
      - run: node --test addon_tests/test_frontend.mjs tests/test_card.mjs
      - run: ruff check .

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: amd64
          - arch: aarch64
            platform: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: version
        run: |
          version="$(sed -n 's/^version: "\(.*\)"$/\1/p' philips_skylight/config.yaml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match config.yaml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./philips_skylight
          platforms: linux/${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ghcr.io/jphelan82/${{ matrix.arch }}-philips-skylight:${{ steps.version.outputs.version }}
            ghcr.io/jphelan82/${{ matrix.arch }}-philips-skylight:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # A release page for the tag, after both images are published. Its notes are
    # that version's section of the add-on changelog.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v head="## $version" '
            $0 == head { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' philips_skylight/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
