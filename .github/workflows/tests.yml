name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install homeassistant==2026.6.0 pytest pytest-asyncio pytest-aiohttp ruff
      - run: python tools/sync_addon.py --check
      - run: python -m pytest -q
      - run: node --test addon_tests/test_frontend.mjs
      - run: ruff check .
