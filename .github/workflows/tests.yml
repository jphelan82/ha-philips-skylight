name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install homeassistant==2026.6.0 pytest pytest-asyncio pytest-aiohttp ruff
      - run: python tools/sync_addon.py --check
      - run: python -m pytest -q
      - run: node --test addon_tests/test_frontend.mjs tests/test_card.mjs
      - run: ruff check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # The integration is not in home-assistant/brands yet.
          ignore: brands
