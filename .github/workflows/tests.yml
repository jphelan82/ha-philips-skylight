name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.6.0 pytest pytest-asyncio pytest-aiohttp ruff
      - run: python tools/sync_addon.py --check
      - run: python -m pytest -q
      - run: ruff check .
