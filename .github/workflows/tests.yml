name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install homeassistant==2026.6.0 pytest pytest-asyncio pytest-aiohttp ruff
      - run: python tools/sync_addon.py --check
      - run: python -m pytest -q
      - run: node --test addon_tests/test_frontend.mjs
      - run: ruff check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The integration is not in home-assistant/brands, and the private
          # repository has no topics yet. Remove these before a public HACS release.
          ignore: brands topics
