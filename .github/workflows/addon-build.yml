name: Add-on container
on:
  push:
    paths: ['philips_skylight/**', '.github/workflows/addon-build.yml']
  pull_request:
    paths: ['philips_skylight/**', '.github/workflows/addon-build.yml']
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./philips_skylight

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: amd64
          - arch: aarch64
            platform: arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"$/\1/p' philips_skylight/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ./philips_skylight
          platforms: linux/${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
