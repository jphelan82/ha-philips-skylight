name: Add-on container
on:
  push:
    paths: ['philips_skylight/**', '.github/workflows/addon-build.yml']
  pull_request:
    paths: ['philips_skylight/**', '.github/workflows/addon-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: amd64
          - arch: aarch64
            platform: arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./philips_skylight
          platforms: linux/${{ matrix.platform }}
          build-args: BUILD_ARCH=${{ matrix.arch }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
